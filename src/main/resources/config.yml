# ============================================================
#  ImaginariumSkills - Configuration principale
# ============================================================

# Prefixe affiche devant les messages du plugin.
prefix: "&8[&bSkills&8] &7"

# ------------------------------------------------------------
#  Courbe d'experience
#  XP necessaire pour passer du niveau N au niveau N+1 :
#    xp = base + (par-niveau * (N - 1)) + (quadratique * (N - 1)^2)
# ------------------------------------------------------------
niveaux:
  niveau-maximum: 100
  xp:
    base: 100
    par-niveau: 25
    quadratique: 5

# ------------------------------------------------------------
#  Sources d'XP
# ------------------------------------------------------------
xp-sources:
  # XP gagnee en tuant des creatures.
  # Cle = type d'entite (https://hub.spigotmc.org/javadocs/spigot/org/bukkit/entity/EntityType.html)
  # "defaut" est utilise pour tout monstre hostile non liste. 0 = desactive.
  kills:
    defaut: 5
    ZOMBIE: 5
    SKELETON: 6
    CREEPER: 8
    SPIDER: 5
    ENDERMAN: 12
    BLAZE: 12
    WITHER_SKELETON: 15
    WARDEN: 200
    ENDER_DRAGON: 500
    WITHER: 300
    PLAYER: 25
  # XP gagnee en minant des blocs (uniquement ceux listes ici,
  # les blocs poses par des joueurs ne rapportent rien).
  blocs:
    COAL_ORE: 2
    DEEPSLATE_COAL_ORE: 2
    IRON_ORE: 3
    DEEPSLATE_IRON_ORE: 3
    COPPER_ORE: 2
    DEEPSLATE_COPPER_ORE: 2
    GOLD_ORE: 4
    DEEPSLATE_GOLD_ORE: 4
    REDSTONE_ORE: 3
    DEEPSLATE_REDSTONE_ORE: 3
    LAPIS_ORE: 4
    DEEPSLATE_LAPIS_ORE: 4
    DIAMOND_ORE: 10
    DEEPSLATE_DIAMOND_ORE: 10
    EMERALD_ORE: 12
    DEEPSLATE_EMERALD_ORE: 12
    NETHER_QUARTZ_ORE: 2
    NETHER_GOLD_ORE: 3
    ANCIENT_DEBRIS: 20

# Multiplicateur global d'XP (1.0 = normal, 2.0 = double XP...).
multiplicateur-xp: 1.0

# Intervalle de sauvegarde automatique des donnees joueurs (en minutes).
sauvegarde-auto-minutes: 5

# Afficher la barre d'XP du plugin dans l'action bar quand on gagne de l'XP.
action-bar: true
